<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches && !document.documentElement.classList.contains('motion-full');
const pick = a => a[Math.floor(Math.random() * a.length)];
let sayT = 0;
const say = (t, ms = 4200) => { const e = $('say'); e.textContent = t; e.classList.add('on'); clearTimeout(sayT); sayT = setTimeout(() => e.classList.remove('on'), ms); $('sr').textContent = t; };

/* ---------- the squares: odd orders by the old rule (1 below the centre, step down-right), even ones as the tables give them ---------- */
function oddSquare(n) {
  const sq = Array.from({ length: n }, () => new Array(n).fill(0)); let r = (n >> 1) + 1, c = n >> 1;

const EVEN = {
  4: [[4,14,15,1],[9,7,6,12],[5,11,10,8],[16,2,3,13]],
  6: [[6,32,3,34,35,1],[7,11,27,28,8,30],[19,14,16,15,23,24],[18,20,22,21,17,13],[25,29,10,9,26,12],[36,5,33,4,2,31]],
  8: [[8,58,59,5,4,62,63,1],[49,15,14,52,53,11,10,56],[41,23,22,44,45,19,18,48],[32,34,35,29,28,38,39,25],[40,26,27,37,36,30,31,33],[17,47,46,20,21,43,42,24],[9,55,54,12,13,51,50,16],[64,2,3,61,60,6,7,57]],
};
const square = n => EVEN[n] || oddSquare(n);
const PLANETS = [
  { k: 'saturn', name: 'Saturn', n: 3, g: '♄', day: 6, col: '#8a8fa8', for: 'endings, protection, binding, time' },
  { k: 'jupiter', name: 'Jupiter', n: 4, g: '♃', day: 4, col: '#4d7bd6', for: 'growth, luck, law' },
  { k: 'mars', name: 'Mars', n: 5, g: '♂', day: 2, col: '#d4463a', for: 'courage, conflict, drive' },
  { k: 'sun', name: 'Sun', n: 6, g: '☉', day: 0, col: '#e8b64c', for: 'success, health of the spirit, being seen' },
  { k: 'venus', name: 'Venus', n: 7, g: '♀', day: 5, col: '#4fb07a', for: 'love, art, friendship' },
  { k: 'mercury', name: 'Mercury', n: 8, g: '☿', day: 3, col: '#d98a3a', for: 'speech, study, trade, messages' },
  { k: 'moon', name: 'Moon', n: 9, g: '☽', day: 1, col: '#c9cde0', for: 'dreams, intuition, travel by water' },

// letter values: the Latin numeration the core uses (VS-LATIN-1), reduced to fit the square
const VAL = { A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,K:10,L:20,M:30,N:40,O:50,P:60,Q:70,R:80,S:90,T:100,U:200,X:300,Y:400,Z:500,J:600,V:700,W:900 };

const WHEEL = ['AEIOUY', 'BCDFGHJK', 'LMNPQRSTVWXZ'];
const letters = s => s.toUpperCase().replace(/[^A-Z]/g, '');
const strike = s => { const seen = new Set(); return [...s].filter(c => !seen.has(c) && seen.add(c)).join(''); };

/* ---------- seeded randomness from the intent (SHA-256), so the same words give the same seal ---------- */
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)]; }

/* ---------- state ---------- */
const METHODS = [
  { k: 'square', name: 'Planet square', t: 'Each letter becomes a number and the number becomes a cell on the planet’s square. The line through the cells is the seal: a circle where it starts, a bar where it ends.' },
  { k: 'wheel', name: 'Wheel', t: 'The letters sit on three rings. Trace the word across them, circle at the first letter, bar at the last. Good for names.' },
  { k: 'word', name: 'Word', t: 'Repeated letters struck out. What’s left is drawn as a single knot around the centre. The full word method lives on the Templum’s rail.' },
];
const FOLDS = [4, 6, 8, 12, 16];
const FOLD_MEAN = { 4: 'four: the body, the world, standing still', 6: 'six: the heart, harmony', 8: 'eight: change, starting over', 12: 'twelve: completion, the whole sky', 16: 'sixteen: the throat, saying it out loud' };
const COLOURS = [
  { name: 'white', c: '#eee8da', m: 'calm, clarity' }, { name: 'yellow', c: '#e8b64c', m: 'richness, giving' }, { name: 'red', c: '#d4463a', m: 'desire turned into love' },
  { name: 'green', c: '#4fb07a', m: 'action, no fear' }, { name: 'blue', c: '#4d7bd6', m: 'wisdom, space' },
];
const ST = { method: 'square', planet: PLANETS[new Date().getDay() === 0 ? 3 : PLANETS.findIndex(p => p.day === new Date().getDay())].k, fold: 0, auto: true, seal: true, rings: true, square: false, draw: false, strokes: [], hash: '', t0: performance.now(), gaze: false, burn: 0 };
let M = null;   // the built mandala

/* ---------- controls ---------- */
function chips(el, items, cur, on) { el.innerHTML = items.map(([k, label, dis]) => `<button type="button" data-k="${k}" aria-pressed="${k === cur}"${dis ? ' disabled' : ''}>${label}</button>`).join(''); el.onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) on(b.dataset.k); }; }
function controls() {
  chips($('methods'), METHODS.map(m => [m.k, m.name]), ST.method, k => { ST.method = k; build(); });
  $('methodHint').textContent = METHODS.find(m => m.k === ST.method).t;
  $('planetBox').hidden = ST.method !== 'square';
  chips($('planets'), PLANETS.map(p => [p.k, p.g + ' ' + p.name]), ST.planet, k => { ST.planet = k; build(); });
  const P = PLANETS.find(p => p.k === ST.planet), today = PLANETS.find(p => p.day === new Date().getDay());
  $('planetHint').textContent = `${P.name}: ${P.for}. Square of ${P.n}, every line sums to ${P.n * (P.n * P.n + 1) / 2}.${today.k === P.k ? ' And it’s his day today.' : ' Today belongs to ' + today.name + '.'}`;
  chips($('folds'), [['auto', 'From the words'], ...FOLDS.map(f => [String(f), f + '-fold'])], ST.auto ? 'auto' : String(FOLDS[ST.fold]), k => { if (k === 'auto') ST.auto = true; else { ST.auto = false; ST.fold = FOLDS.indexOf(+k); } build(); });

  $('layers').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST[b.dataset.k] = !ST[b.dataset.k]; controls(); };
}

/* ---------- building: seal path + mandala rings ---------- */
async function build() {
  controls(); ST.drawnAt = performance.now();
  const raw = $('intent').value.trim(), L = letters(raw);
  const bytes = await sha('VS-FORGE-1|' + ST.method + '|' + ST.planet + '|' + raw.toLowerCase());
  ST.hash = bytes.map(b => b.toString(16).padStart(2, '0')).join('');
  const R = rng(bytes);
  const fold = ST.auto ? FOLDS[bytes[0] % FOLDS.length] : FOLDS[ST.fold];
  const col = COLOURS[bytes[1] % 5], col2 = COLOURS[(bytes[1] + 1 + bytes[2] % 4) % 5];
  // the seal, in unit coordinates (-1..1)
  let pts = [], grid = null, P = PLANETS.find(p => p.k === ST.planet), used = '';
  if (L) {
    if (ST.method === 'square') {
      const n = P.n, sq = square(n), max = n * n; used = L;
      const pos = v => { for (let r = 0; r < n; r++) { const c = sq[r].indexOf(v); if (c >= 0) return [(c + .5) / n * 2 - 1, (r + .5) / n * 2 - 1]; } };
      pts = [...L].map(ch => pos(reduce(VAL[ch], max)));
      grid = { n, sq };
    } else if (ST.method === 'wheel') {
      used = L;
      pts = [...L].map(ch => { const ring = WHEEL.findIndex(w => w.includes(ch)), w = WHEEL[ring], i = w.indexOf(ch), a = i / w.length * Math.PI * 2 - Math.PI / 2 + ring * .2, r = .3 + ring * .3; return [Math.cos(a) * r, Math.sin(a) * r]; });

    } else {
      used = strike(L);
      pts = [...used].map((ch, i) => { const v = VAL[ch], a = (v % 360) / 180 * Math.PI + i * .9, r = .25 + (v % 7) / 9; return [Math.cos(a) * r, Math.sin(a) * r]; });

}

  const { fold, col, col2, used, P, raw } = M;
  if (!raw) { $('meaning').innerHTML = '<p>Type what you want. One thing. He’ll forge the rest.</p>'; return; }

    (ST.method === 'square' ? `<p><b>${P.g} ${P.name}.</b> Drawn on his square of ${P.n}. Best made on his day and kept in his colour.</p>` : '') +
    `<p><b>Letters used.</b> ${esc(used.split('').join(' ') || '—')}</p><p class="hint">Seal ${ST.hash.slice(0, 12)}</p>`;

/* ---------- drawing ---------- */
const cv = $('cv'), cx = cv.getContext('2d');
let W = 0;

function motif(m, a, r0, r1, k) {

      const drop = !phone.matches; sh.classList.toggle('vs-drop', drop);
      if (drop) { const b = btn.getBoundingClientRect(), r = bar.getBoundingClientRect(); sh.style.setProperty('--vs-bar-b', r.bottom + 'px'); sh.style.setProperty('--vs-drop-x', Math.max(10, b.left) + 'px'); }
      sh.hidden = false; sh.scrollTop = 0; void sh.offsetWidth; sh.classList.add('on');   // no waiting on a frame: a paused frame once left the menu invisible over the whole screen btn.setAttribute('aria-expanded', 'true');
      // a phone's Back gesture closes the menu instead of leaving the page
      if (!drop && !pushed) { try { history.pushState({ vsRooms: 1 }, ''); pushed = true; } catch (e) {} }
      sh.querySelector('.vs-x').focus({ preventScroll: true }); };
    let pushed = false;
    const close = (fromBack) => { if (sh.hidden) return; sh.classList.remove('on'); btn.setAttribute('aria-expanded', 'false'); setTimeout(() => { if (!sh.classList.contains('on')) sh.hidden = true; }, 230);
      if (pushed && fromBack !== true) { pushed = false; try { history.back(); } catch (e) {} } else pushed = false; };
    const shut = () => { sh.classList.remove('on'); sh.hidden = true; btn.setAttribute('aria-expanded', 'false'); pushed = false; };   // instant, for leaving the page
    window.VS_ROOMS_SHUT = shut;
    addEventListener('popstate', () => { if (pushed) { pushed = false; close(true); } });
    btn.addEventListener('click', open); sh.querySelector('.vs-x').addEventListener('click', close); sh.querySelector('.vs-sh-close').addEventListener('click', close);
    sh.addEventListener('click', e => { if (e.target === sh) close(); });
    document.addEventListener('pointerdown', e => { if (!sh.hidden && sh.classList.contains('vs-drop') && !sh.contains(e.target) && !btn.contains(e.target)) close(); }, true);
    tools.addEventListener('click', () => setTimeout(close, 0));   // a tool does its job, then the sheet gets out of the way
    addEventListener('keydown', e => { if (e.key === 'Escape' && !sh.hidden) { e.stopImmediatePropagation(); close(); btn.focus({ preventScroll: true }); } }, true);
    // on a phone the page's own bar buttons live in the sheet; on a wider screen they go back where they came from
    const pick = el => el.matches('button, a, .motion-btn') && !el.matches('.vs-menu, .vs-room, .unzoom');
    let moving = false;
    const place = () => { moving = true;
      if (phone.matches) { [...bar.children].filter(pick).forEach(el => { if (!el.__vsHome) { el.__vsHome = document.createComment('vs'); el.before(el.__vsHome); } tools.append(el); }); }
      else [...tools.children].forEach(el => { if (el.__vsHome && el.__vsHome.parentNode) el.__vsHome.replaceWith(el); else bar.append(el); el.__vsHome = null; });
      syncHead(); moving = false; };
    // the room names show in the bar when they all fit; when they don't, the ROOMS button takes their place
    const nav = bar.querySelector('.vs-rooms');
    const fit = () => { if (phone.matches || !nav) { bar.classList.add('vs-tight'); return; } bar.classList.remove('vs-tight'); if (nav.scrollWidth > nav.clientWidth + 2) bar.classList.add('vs-tight'); };
    let fq = 0; const fitSoon = () => { cancelAnimationFrame(fq); fq = requestAnimationFrame(fit); };
    place(); fit(); phone.addEventListener('change', () => { place(); fit(); }); addEventListener('resize', fitSoon);
    try { document.fonts.ready.then(fitSoon); } catch (e) {}
    new MutationObserver(() => { if (!moving && phone.matches) place(); fitSoon(); }).observe(bar, { childList: true });
    // first visit to the house: the rooms announce themselves once, so nobody thinks this is the only one
    const hint = { el: null, t: 0, done() { clearTimeout(this.t); try { localStorage.setItem('vs-rooms-hint', '1'); } catch (e) {} btn.classList.remove('vs-call'); if (this.el) { const el = this.el; this.el = null; el.classList.remove('on'); setTimeout(() => el.remove(), 600); } } };
    let seen = true; try { seen = !!localStorage.getItem('vs-rooms-hint'); } catch (e) {}
    if (!seen) hint.t = setTimeout(() => {
      const tight = bar.classList.contains('vs-tight'), a = (tight ? btn : nav).getBoundingClientRect(); if (!a.width) return;
      const el = hint.el = document.createElement('div'); el.className = 'vs-hint'; el.setAttribute('role', 'status');
      el.innerHTML = `<b>${ROOMS.length} rooms</b>${tight ? 'There’s more than this one. Open the menu.' : 'This is one of them. The rest are up here.'}`;
      document.body.append(el); el.style.left = Math.max(10, a.left) + 'px'; el.style.top = (a.bottom + 10) + 'px'; el.style.setProperty('--ax', Math.min(a.width / 2, 40) + 'px');
      if (tight) btn.classList.add('vs-call'); requestAnimationFrame(() => el.classList.add('on'));
      try { localStorage.setItem('vs-rooms-hint', '1'); } catch (e) {}
      hint.t = setTimeout(() => hint.done(), 9000);
    }, 2400);
    nav && nav.addEventListener('click', () => hint.done());
  }

  /* ---------- sparks ---------- */
  let cv, g, P = [], running = false, last = null;
  function sparks() {
    if (calm) return;
    cv = document.createElement('canvas'); cv.id = 'vs-sparks'; document.body.append(cv); g = cv.getContext('2d');
    const size = () => { cv.width = innerWidth; cv.height = innerHeight; }; size(); addEventListener('resize', size);
    addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; const d = last ? Math.hypot(e.clientX - last[0], e.clientY - last[1]) : 99; if (d < 26) return; last = [e.clientX, e.clientY]; add(e.clientX, e.clientY, 1, .22); });
    addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 9), true);
  }
  function add(x, y, n, spd) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = spd * (.4 + Math.random()); P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .25, life: 1, d: .012 + Math.random() * .014, r: 1 + Math.random() * 2.2, hue: Math.random() < .2 ? 1 : 0 }); } if (P.length > 260) P.splice(0, P.length - 260); if (!running) { running = true; requestAnimationFrame(tick); } }
  function burst(x, y, n) { if (calm || !cv) return; add(x, y, n, 2.6); P.push({ ring: true, x, y, life: 1, d: .045 }); }
  function tick() {
    g.clearRect(0, 0, cv.width, cv.height); g.globalCompositeOperation = 'lighter';
    for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; p.life -= p.d; if (p.life <= 0) { P.splice(i, 1); continue; }
      if (p.ring) { g.strokeStyle = `rgba(255,214,140,${p.life * .7})`; g.lineWidth = 1.5; g.beginPath(); g.arc(p.x, p.y, (1 - p.life) * 46, 0, 7); g.stroke(); continue; }
      p.x += p.vx; p.y += p.vy; p.vy -= .012; p.vx *= .985; const a = p.life, r = p.r * (.5 + a * .7);
      g.fillStyle = p.hue ? `rgba(200,225,255,${a * .9})` : `rgba(255,${200 + 40 * a | 0},${120 + 60 * a | 0},${a * .9})`; g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
      g.fillStyle = `rgba(255,200,120,${a * .12})`; g.beginPath(); g.arc(p.x, p.y, r * 4, 0, 7); g.fill(); }
    g.globalCompositeOperation = 'source-over';
    if (P.length) requestAnimationFrame(tick); else { running = false; g.clearRect(0, 0, cv.width, cv.height); }
  }
  window.VS_BURST = (x, y, n = 20) => burst(x, y, n);

  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', build); else build();
})();

</script>

<script type="module">
const $ = id => document.getElementById(id);
const IW = 2944, IH = 1648;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches && !document.documentElement.classList.contains('motion-full');
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sr = t => { $('sr').textContent = ''; setTimeout(() => { $('sr').textContent = t; }, 30); };

/* ---------- the device (positions on the 2944 × 1648 picture) ---------- */
const M = {
  oval: { x: 2005, y: 830, rx: 268, ry: 412 },          // the cat's portrait, inside the rune band
  glass: { x: 1636, y: 262, w: 760, h: 1140 },           // the whole right-hand mirror
  port: { x: 1025, y: 980, r: 150 },                     // the round porthole on the left
  led: { x: 852, y: 1377, w: 358, h: 98 },               // the little screen
  left: [437, 537, 637, 737, 837, 937].map(y => ({ x: 642, y, r: 46 })),
  right: [537, 637, 737, 837, 937].map(y => ({ x: 1395, y, r: 46 })),
};
const SURF = [
  { k: 'silver', name: 'Silver', t: 'The ordinary mirror, by candle. Start here.' },
  { k: 'black', name: 'Black', t: 'Obsidian. Only the light parts of you come back.' },
  { k: 'infinity', name: 'Infinity', t: 'Two mirrors facing. It goes all the way down and it lags.' },
  { k: 'other', name: 'Other self', t: 'One half of your face, twice. Meet the other one.' },
  { k: 'corridor', name: 'Corridor', t: 'Two mirrors and two candles, the Yuletide way. Look down the corridor.' },
  { k: 'cover', name: 'Cover', t: 'Throw the cloth over it. Always cover it when you’re done.' },
];
const LENGTHS = [60, 180, 600];
const RIGHT = [
  { t: 'One minute', p: 'Start here. A minute is plenty the first few times.' },
  { t: 'Three minutes', p: 'Long enough for your face to start doing things.' },
  { t: 'Ten minutes', p: 'The deep sitting. For when the short ones feel easy. He asks you first.' },
  { t: 'Questions', p: 'He asks you things while you look. Answer in your head.' },
  { t: 'Journal', p: 'Everything you said you saw, kept on this computer.' },
];
const ST = { surf: 0, len: 0, dark: false, ask: false, awake: 0, wakeTo: 0, stream: null, video: null, sitting: false, hover: null, muted: false, otherSide: 0 };
try { const s = JSON.parse(localStorage.getItem('vs-mirror') || '{}'); if (s.surf >= 0 && s.surf < 5) ST.surf = s.surf; if (s.len >= 0 && s.len < 2) ST.len = s.len; ST.ask = !!s.ask; ST.dark = !!s.dark; } catch (e) {}
const keep = () => { try { localStorage.setItem('vs-mirror', JSON.stringify({ surf: ST.surf, len: ST.len < 2 ? ST.len : 0, ask: ST.ask, dark: ST.dark })); } catch (e) {} };

/* ---------- his lines ---------- */
const L = {
  hello: ['Touch the mirror. Your face goes where mine was. Don’t get used to it.', 'Go on, wake it. It’s been waiting all day.', 'Mirror’s asleep. So was I.'],
  woke: ['There you are.', 'Oh. It’s you.', 'Hi. Fix nothing. It sees you doing it.', 'That’s the face you went out with today?'],
  sleep: ['Covered. Good manners.', 'Cloth’s on. It can rest now.'],
  surf: { silver: 'Silver. Plain glass, candle light.', black: 'Black. Obsidian rules.', infinity: 'Infinity. Don’t count them.', other: 'Other self. That one’s been waiting.', corridor: 'Corridor. Look down it, not at it.' },
  len: ['One minute. Good start.', 'Three minutes. Fine.', 'Ten minutes. Now we’re talking.'],
  start: ['Look at one eye. Just one.', 'Pick an eye. Stay on it.', 'Your eyes. Not your hair.'],
  during: ['Don’t fix your hair. It can see you doing it.', 'If your face changes, keep going. That’s the point.', 'Stop checking if it’s working.', 'Blink when you have to. Not before.', 'Somebody older might look back. Be polite.', 'Your edges are going. Let them.', 'Don’t talk to it yet.', 'Still you? Check again.', 'It’s looking at you exactly as hard as you’re looking at it.', 'Slower breath. Same eye.', 'Whatever shows up, don’t greet it with that face.', 'You moved. Back to the eye.'],
  ask: ['What do you keep not saying out loud?', 'Who taught you that face?', 'What would you do if nobody was watching?', 'Which version of you is tired?', 'What are you pretending not to want?', 'Who do you turn into around your family?', 'What does this face want that you keep saying no to?', 'Who have you been copying lately?', 'What are you scared it’ll show you?', 'If this was the last time you saw yourself, what would you say?', 'Who looks back at you when you’re angry?', 'What did you look like before anyone told you what you looked like?'],
  end: ['Done. Don’t look away yet.', 'Time. Stay one more breath.', 'That’s it. Slowly.'],
};
const SEEN = [
  ['changed', 'My face changed', 'Your face moved and you didn’t. Write down what it turned into before you forget.'],
  ['old', 'Someone older', 'Someone older sat in for you. That happens. Thank them.'],
  ['young', 'Me, younger', 'A younger you. Ask what they wanted. You’ll know.'],
  ['animal', 'An animal', 'An animal. Look up what it means tonight, then come back and tell me.'],
  ['known', 'Someone I know', 'Someone you know. They’ll be on your mind all day now. Sorry.'],
  ['stranger', 'A stranger', 'A stranger. Not a stranger to the mirror.'],
  ['dark', 'It went dark', 'It went dark. That’s it opening. Stay longer next time.'],
  ['light', 'Light or colour', 'Light around you. Some people would charge for that.'],
  ['nothing', 'Nothing', 'Nothing. Most people need a few sittings. The mirror’s in no hurry.'],
];

/* ---------- toasts ---------- */
let sayT = 0;
const say = (t, ms = 4200) => { const el = $('say'); el.textContent = t; el.classList.add('on'); clearTimeout(sayT); sayT = setTimeout(() => el.classList.remove('on'), ms); sr(t); };

/* ---------- camera ---------- */
async function camera() {
  if (ST.stream) return true;

      document.body.append(el); el.style.left = Math.max(10, a.left) + 'px'; el.style.top = (a.bottom + 10) + 'px'; el.style.setProperty('--ax', Math.min(a.width / 2, 40) + 'px');
      if (tight) btn.classList.add('vs-call'); requestAnimationFrame(() => el.classList.add('on'));
      try { localStorage.setItem('vs-rooms-hint', '1'); } catch (e) {}
      hint.t = setTimeout(() => hint.done(), 9000);
    }, 2400);
    nav && nav.addEventListener('click', () => hint.done());
  }

  /* ---------- sparks ---------- */
  let cv, g, P = [], running = false, last = null;
  function sparks() {
    if (calm) return;
    cv = document.createElement('canvas'); cv.id = 'vs-sparks'; document.body.append(cv); g = cv.getContext('2d');
    const size = () => { cv.width = innerWidth; cv.height = innerHeight; }; size(); addEventListener('resize', size);
    addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; const d = last ? Math.hypot(e.clientX - last[0], e.clientY - last[1]) : 99; if (d < 26) return; last = [e.clientX, e.clientY]; add(e.clientX, e.clientY, 1, .22); });
    addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 9), true);
  }
  function add(x, y, n, spd) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = spd * (.4 + Math.random()); P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .25, life: 1, d: .012 + Math.random() * .014, r: 1 + Math.random() * 2.2, hue: Math.random() < .2 ? 1 : 0 }); } if (P.length > 260) P.splice(0, P.length - 260); if (!running) { running = true; requestAnimationFrame(tick); } }
  function burst(x, y, n) { if (calm || !cv) return; add(x, y, n, 2.6); P.push({ ring: true, x, y, life: 1, d: .045 }); }
  function tick() {
    g.clearRect(0, 0, cv.width, cv.height); g.globalCompositeOperation = 'lighter';
    for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; p.life -= p.d; if (p.life <= 0) { P.splice(i, 1); continue; }
      if (p.ring) { g.strokeStyle = `rgba(255,214,140,${p.life * .7})`; g.lineWidth = 1.5; g.beginPath(); g.arc(p.x, p.y, (1 - p.life) * 46, 0, 7); g.stroke(); continue; }
      p.x += p.vx; p.y += p.vy; p.vy -= .012; p.vx *= .985; const a = p.life, r = p.r * (.5 + a * .7);
      g.fillStyle = p.hue ? `rgba(200,225,255,${a * .9})` : `rgba(255,${200 + 40 * a | 0},${120 + 60 * a | 0},${a * .9})`; g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
      g.fillStyle = `rgba(255,200,120,${a * .12})`; g.beginPath(); g.arc(p.x, p.y, r * 4, 0, 7); g.fill(); }
    g.globalCompositeOperation = 'source-over';
    if (P.length) requestAnimationFrame(tick); else { running = false; g.clearRect(0, 0, cv.width, cv.height); }
  }
  window.VS_BURST = (x, y, n = 20) => burst(x, y, n);

  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', build); else build();
})();

</script>
</body>
